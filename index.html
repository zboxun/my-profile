<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile</title>
<link rel="stylesheet" href="style.css">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
rel="stylesheet">
</head>
<body>
<div class="wrapper">
<!-- 第一頁:個人主卡片 -->
<section class="first-screen">
<div class="card">
<img src="avatar.jpg" alt="Avatar" class="avatar">
<h1>Your Name</h1>
<p class="bio">個人簡介或標語</p>
<div class="links">
<a href="https://instagram.com" target="_blank"><i class="fab fa-instagram"></i></a>
<a href="https://discord.com" target="_blank"><i class="fab fa-discord"></i></a>
<a href="https://github.com" target="_blank"><i class="fab fa-github"></i></a>
</div>
<div class="scroll-down">
<p>往下滑看更多</p>
<i class="fas fa-chevron-down"></i>
</div>
</div>
</section>
•
•
•

<!-- 第二頁:專長與經歷卡片 -->
<section class="second-screen">
<div class="card content-card">
<h2><i class="fas fa-star"></i> 個人專長</h2>
<div class="skills-grid">
<div class="skill-tag">UI / UX 設計</div>
<div class="skill-tag">前端開發</div>
<div class="skill-tag">Python</div>
<div class="skill-tag">影音剪輯</div>
</div>
<h2 style="margin-top: 25px;"><i class="fas fa-user"></i> 關於我</h2>
<p class="about-text">
這裡填寫詳細的興趣與個人經歷。
</p>
</div>
</section>
</div>
</body>
</html>
